<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Schedule</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Lab Schedule</h1>
    <p id="updated" class="muted"></p>
  </header>

  <main>
    <div id="messages" role="status"></div>
    <div id="filters" class="filters" aria-label="Filter by lab member"></div>
    <div class="calendar-scroll">
      <div id="calendar" class="calendar"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
